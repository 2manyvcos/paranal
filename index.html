<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="%PARANAL_CONFIG_TAGLINE%" />
    <link rel="icon" href="%PARANAL_CONFIG_FAVICON%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" href="%PARANAL_CONFIG_APPLE_TOUCH_ICON%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="%PARANAL_CONFIG_THEME%" />
    <title>%PARANAL_CONFIG_APP_NAME%</title>
    <style>
      :root {
        --t-app-name: '%PARANAL_CONFIG_APP_NAME%';
        --t-tagline: '%PARANAL_CONFIG_TAGLINE%';
        --t-logo: url('%PARANAL_CONFIG_LOGO%');
      }
    </style>
    <script>
      window.paranal = {
        appName: '%PARANAL_CONFIG_APP_NAME%',
        tagline: '%PARANAL_CONFIG_TAGLINE%',
        logo: '%PARANAL_CONFIG_LOGO%',
        footer: '%PARANAL_CONFIG_FOOTER%',
        logoutRedirectURL: '%PARANAL_CONFIG_LOGOUT_REDIRECT_URL%',
      };

      const customScript = '%PARANAL_CONFIG_CUSTOM_SCRIPT%';
      if (customScript) import(customScript);
    </script>
  </head>
  <body>
    <div id="root" class="app"></div>
    <script type="module" src="/client/src/main.tsx"></script>
  </body>
</html>
