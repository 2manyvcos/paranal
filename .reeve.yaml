---
type: pipeline
name: deploy paranal documentation

when:
  workerGroup: { include: [soldier@midgar] }
  trigger: { include: [commit, action] }
  action: { include: [paranal:deploy-documentation] }

steps:
  - name: deploy
    task: '@reeve/npm-cli'
    params:
      GIT_USER_EMAIL: { env: forgejo/aaron/paranal/email }
      GIT_USER_NAME: { env: forgejo/aaron/paranal/name }
      GIT_REMOTE: { env: forgejo/aaron/paranal/url }
    command: /bin/sh
    input: |
      set -e

      git config --global user.email "$GIT_USER_EMAIL"
      git config --global user.name "$GIT_USER_NAME"
      unset GIT_USER_EMAIL GIT_USER_NAME

      git clone "$GIT_REMOTE" --branch pages docs/.vitepress/dist
      COMMIT_HASH=$(git rev-parse --short HEAD)

      npm ci
      npm run docs:build

      cd docs/.vitepress/dist
      git add .
      git commit -m "Deploy website - based on $COMMIT_HASH"
      git push
