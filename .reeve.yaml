---
type: pipeline
name: build image - docker.io/2manyvcos/paranal

when:
  workerGroup: { include: [soldier@midgar] }
  trigger: { include: [commit, action] }
  file:
    include:
      - package.json
      - .reeve.yaml
  action: { include: [images:docker.io/2manyvcos/paranal:build] }

steps:
  - name: get package version
    task: '@reeve/node-get-package-version'
    params:
      RESULT_VAR: PARANAL_VERSION

  - name: build image - docker.io/2manyvcos/paranal
    task: '@docker/build'
    params:
      DOCKER_LOGIN_REGISTRIES: { env: docker/hub/2manyvcos/login }
      NAME: docker.io/2manyvcos/paranal
      TAG: { var: PARANAL_VERSION }
      PLATFORM: amd64,arm64
      BUILD_DRIVER: docker-container

---
type: pipeline
name: deploy page - 2manyvcos.github.io/paranal

when:
  workerGroup: { include: [soldier@midgar] }
  trigger: { include: [commit, action] }
  action: { include: [pages:2manyvcos.github.io/paranal:deploy] }

steps:
  - name: deploy page - 2manyvcos.github.io/paranal
    task: '@reeve/npm-cli'
    params:
      GIT_USER_EMAIL: { env: forgejo/aaron/paranal/email }
      GIT_USER_NAME: { env: forgejo/aaron/paranal/name }
      GIT_REMOTE: { env: forgejo/aaron/paranal/url }
    command: /bin/sh
    input: |
      set -e

      git config --global user.email "$GIT_USER_EMAIL"
      git config --global user.name "$GIT_USER_NAME"
      unset GIT_USER_EMAIL GIT_USER_NAME

      git clone "$GIT_REMOTE" --branch pages docs/.vitepress/dist
      COMMIT_HASH=$(git rev-parse --short HEAD)

      npm ci
      npm run docs:build

      cd docs/.vitepress/dist
      git add .
      git commit -m "Deploy website - based on $COMMIT_HASH"
      git push
