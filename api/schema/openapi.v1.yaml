openapi: 3.1.1
info:
  title: Paranal API
  description: |-
    This documentation describes the Paranal API.
  license:
    name: This file is distributed under the MIT license for the purpose of interoperability
    url: https://opensource.org/licenses/MIT
  version: 1.0.0
externalDocs:
  description: Paranal Documentation
  url: https://2manyvcos.github.io/paranal
servers:
  - url: '{{ .api }}/v1'
tags:
  - name: Auth
    description: Authenticate to the API
  - name: Events
    description: Get client events
  - name: User
    description: Manage your user profile
  - name: User Alert Channels
    description: Manage your alerting channels
  - name: Layout
    description: Manage the client layout
  - name: Scrape Website Logo
    description: Scrape a website for its logo
  - name: Users
    description: Manage users
  - name: HTTP Credentials
    description: Manage HTTP credentials
  - name: SSH Credentials
    description: Manage SSH credentials
  - name: User Credentials
    description: Manage user credentials
paths:
  /auth:
    post:
      tags: [Auth]
      summary: Authenticate to the API
      operationId: postAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userName, password]
              properties:
                userName:
                  description: User name used for authentication
                  type: string
                  example: max
                password:
                  description: Password of the user to be authenticated
                  type: string
                  example: p4ssw0rd
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  userName:
                    description: User name of the authenticated user
                    type: string
                    example: max
                  accessToken:
                    description: Bearer token to be used for further API requests
                    type: string
                    format: jwt
                    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJvcmlnaW4iOiJhcGkiLCJzdWIiOiJtYXgiLCJleHAiOjE3NzI3NDk5MjN9.XSLz_Q4ELipGowUovYviaG22GlaIduiFY2Q4YXG7aYI'
                  expires:
                    description: 'Time at which `accessToken` expires'
                    type: string
                    format: date-time
                    example: '2026-03-05T10:35:39.000Z'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        default:
          description: Unexpected error
  /events:
    get:
      tags: [Events]
      summary: Get client events
      operationId: getEvents
      responses:
        '200':
          description: Successful operation
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UpdateEvent'
                discriminator:
                  propertyName: event
                  mapping:
                    update: '#/components/schemas/UpdateEvent'
        '401':
          description: Unauthorized
        default:
          description: Unexpected error
  /user:
    get:
      tags: [User]
      summary: Get your user profile
      operationId: getUser
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
        default:
          description: Unexpected error
    patch:
      tags: [User]
      summary: Patch your user profile
      operationId: patchUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthorized
        default:
          description: Unexpected error
    delete:
      tags: [User]
      summary: Delete your user profile
      operationId: deleteUser
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthorized
        default:
          description: Unexpected error
  /user/password:
    put:
      tags: [User]
      summary: Update your password
      operationId: putUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  description: Current password
                  type: string
                  example: p4ssw0rd
                newPassword:
                  description: New password
                  type: string
                  example: p4ssw0rd!
      responses:
        '200':
          description: Successful operation
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        default:
          description: Unexpected error
  /user/alert-channels:
    get:
      tags: [User Alert Channels]
      summary: List your alert channels
      operationId: getUserAlertChannels
      parameters:
        - in: query
          name: id
          description: 'Filter results by `id`'
          schema:
            type: string
            example: e222bdbd-9b08-4a85-b939-0dfce13547b6
        - in: query
          name: userName
          description: 'Filter results by `userName`'
          schema:
            type: string
            example: max
        - in: query
          name: hasURL
          description: 'Filter results by `url`'
          schema:
            type: boolean
        - in: query
          name: errorAlerts
          description: 'Filter results by `errorAlerts`'
          schema:
            type: boolean
        - in: query
          name: healthAlerts
          description: 'Filter results by `healthAlerts`'
          schema:
            type: boolean
        - in: query
          name: versionAlerts
          description: 'Filter results by `versionAlerts`'
          schema:
            type: boolean
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAlertChannel'
        '401':
          description: Unauthorized
        default:
          description: Unexpected error
    post:
      tags: [User Alert Channels]
      summary: Create an alert channel
      operationId: postUserAlertChannels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAlertChannel'
              required: [url]
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    description: Channel ID
                    type: string
                    example: e222bdbd-9b08-4a85-b939-0dfce13547b6
        '401':
          description: Unauthorized
        default:
          description: Unexpected error
  /user/alert-channels/{channelID}:
    parameters:
      - in: path
        name: channelID
        description: Channel ID
        required: true
        schema:
          type: string
          example: e222bdbd-9b08-4a85-b939-0dfce13547b6
    get:
      tags: [User Alert Channels]
      summary: Get an alert channel
      operationId: getUserAlertChannelsByID
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAlertChannel'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        default:
          description: Unexpected error
    patch:
      tags: [User Alert Channels]
      summary: Patch an alert channel
      operationId: patchUserAlertChannelsByID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAlertChannel'
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthorized
        '404':
          description: Not found
        default:
          description: Unexpected error
    delete:
      tags: [User Alert Channels]
      summary: Delete an alert channel
      operationId: deleteUserAlertChannelsByID
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthorized
        '404':
          description: Not found
        default:
          description: Unexpected error
  /layout:
    get:
      tags: [Layout]
      summary: Get the client layout
      operationId: getLayout
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layout'
        '401':
          description: Unauthorized
        default:
          description: Unexpected error
    put:
      tags: [Layout]
      summary: Set the client layout
      description: Requires the `admin` privilege role
      operationId: putLayout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Layout'
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        default:
          description: Unexpected error
  /scrape-website-logo:
    post:
      tags: [Scrape Website Logo]
      summary: Scrape a website for its logo
      operationId: postScrapeWebsiteLogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  description: URL of the website to be scraped
                  type: string
                  format: uri
                  example: https://example.com
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  logo:
                    description: URL of the scraped website logo
                    type: string
                    format: uri
                    example: data:image/svg+xml;base64,…
        '401':
          description: Unauthorized
        '404':
          description: Not found
        default:
          description: Unexpected error
  /users:
    get:
      tags: [Users]
      summary: List users
      description: Requires the `admin` privilege role
      operationId: getUsers
      parameters:
        - in: query
          name: name
          description: 'Filter results by `name`'
          schema:
            type: string
            example: max
        - in: query
          name: role
          description: 'Filter results by `role`'
          schema:
            type: string
            enum: [common, admin]
        - in: query
          name: hasPassword
          description: 'Filter results by `password`'
          schema:
            type: boolean
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        default:
          description: Unexpected error
    post:
      tags: [Users]
      summary: Create a user
      description: Requires the `admin` privilege role
      operationId: postUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/User'
                  required: [name, role]
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    description: User name
                    type: string
                    example: max
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict
        default:
          description: Unexpected error
  /users/{userName}:
    parameters:
      - in: path
        name: userName
        description: User name
        required: true
        schema:
          type: string
          example: max
    get:
      tags: [Users]
      summary: Get a user
      description: Requires the `admin` privilege role
      operationId: getUsersByName
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        default:
          description: Unexpected error
    patch:
      tags: [Users]
      summary: Patch a user
      description: Requires the `admin` privilege role
      operationId: patchUsersByName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/User'
                - properties:
                    name:
                      readOnly: true
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        default:
          description: Unexpected error
    delete:
      tags: [Users]
      summary: Delete a user
      description: Requires the `admin` privilege role
      operationId: deleteUsersByName
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        default:
          description: Unexpected error
  /http-credentials:
    get:
      tags: [HTTP Credentials]
      summary: List HTTP credentials
      description: Requires the `admin` privilege role
      operationId: getHTTPCredentials
      parameters:
        - in: query
          name: name
          description: 'Filter results by `name`'
          schema:
            type: string
            example: my-credential
        - in: query
          name: type
          description: 'Filter results by `type`'
          schema:
            type: string
            enum: [basic, bearer, header, query]
        - in: query
          name: key
          description: 'Filter results by `key`'
          schema:
            type: string
            example: max
        - in: query
          name: hasValue
          description: 'Filter results by `value`'
          schema:
            type: boolean
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HTTPCredential'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        default:
          description: Unexpected error
    post:
      tags: [HTTP Credentials]
      summary: Create an HTTP credential
      description: Requires the `admin` privilege role
      operationId: postHTTPCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/HTTPCredential'
                  required: [name, type, value]
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    description: Credential name
                    type: string
                    example: my-credential
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict
        default:
          description: Unexpected error
  /http-credentials/{credentialName}:
    parameters:
      - in: path
        name: credentialName
        description: Credential name
        required: true
        schema:
          type: string
          example: my-credential
    get:
      tags: [HTTP Credentials]
      summary: Get an HTTP credential
      description: Requires the `admin` privilege role
      operationId: getHTTPCredentialsByName
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPCredential'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        default:
          description: Unexpected error
    patch:
      tags: [HTTP Credentials]
      summary: Patch an HTTP credential
      description: Requires the `admin` privilege role
      operationId: patchHTTPCredentialsByName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/HTTPCredential'
                - properties:
                    name:
                      readOnly: true
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        default:
          description: Unexpected error
    delete:
      tags: [HTTP Credentials]
      summary: Delete an HTTP credential
      description: Requires the `admin` privilege role
      operationId: deleteHTTPCredentialsByName
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        default:
          description: Unexpected error
  /ssh-credentials:
    get:
      tags: [SSH Credentials]
      summary: List SSH credentials
      description: Requires the `admin` privilege role
      operationId: getSSHCredentials
      parameters:
        - in: query
          name: name
          description: 'Filter results by `name`'
          schema:
            type: string
            example: my-credential
        - in: query
          name: user
          description: 'Filter results by `user`'
          schema:
            type: string
            example: max
        - in: query
          name: hasPassword
          description: 'Filter results by `password`'
          schema:
            type: boolean
        - in: query
          name: hasPrivateKey
          description: 'Filter results by `privateKey`'
          schema:
            type: boolean
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SSHCredential'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        default:
          description: Unexpected error
    post:
      tags: [SSH Credentials]
      summary: Create an SSH credential
      description: Requires the `admin` privilege role
      operationId: postSSHCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SSHCredential'
                  required: [name, user]
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    description: Credential name
                    type: string
                    example: my-credential
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict
        default:
          description: Unexpected error
  /ssh-credentials/{credentialName}:
    parameters:
      - in: path
        name: credentialName
        description: Credential name
        required: true
        schema:
          type: string
          example: my-credential
    get:
      tags: [SSH Credentials]
      summary: Get an SSH credential
      description: Requires the `admin` privilege role
      operationId: getSSHCredentialsByName
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHCredential'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        default:
          description: Unexpected error
    patch:
      tags: [SSH Credentials]
      summary: Patch an SSH credential
      description: Requires the `admin` privilege role
      operationId: patchSSHCredentialsByName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SSHCredential'
                - properties:
                    name:
                      readOnly: true
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        default:
          description: Unexpected error
    delete:
      tags: [SSH Credentials]
      summary: Delete an SSH credential
      description: Requires the `admin` privilege role
      operationId: deleteSSHCredentialsByName
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        default:
          description: Unexpected error
  /user-credentials:
    get:
      tags: [User Credentials]
      summary: List user credentials
      description: Requires the `admin` privilege role
      operationId: getUserCredentials
      parameters:
        - in: query
          name: name
          description: 'Filter results by `name`'
          schema:
            type: string
            example: my-credential
        - in: query
          name: description
          description: 'Filter results by `description`'
          schema:
            type: string
            example: My secret credential
        - in: query
          name: hasValue
          description: 'Filter results by `value`'
          schema:
            type: boolean
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCredential'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        default:
          description: Unexpected error
    post:
      tags: [User Credentials]
      summary: Create a user credential
      description: Requires the `admin` privilege role
      operationId: postUserCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/UserCredential'
                  required: [name, value]
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    description: Credential name
                    type: string
                    example: my-credential
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict
        default:
          description: Unexpected error
  /user-credentials/{credentialName}:
    parameters:
      - in: path
        name: credentialName
        description: Credential name
        required: true
        schema:
          type: string
          example: my-credential
    get:
      tags: [User Credentials]
      summary: Get a user credential
      description: Requires the `admin` privilege role
      operationId: getUserCredentialsByName
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCredential'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        default:
          description: Unexpected error
    patch:
      tags: [User Credentials]
      summary: Patch a user credential
      description: Requires the `admin` privilege role
      operationId: patchUserCredentialsByName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/UserCredential'
                - properties:
                    name:
                      readOnly: true
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        default:
          description: Unexpected error
    delete:
      tags: [User Credentials]
      summary: Delete a user credential
      description: Requires the `admin` privilege role
      operationId: deleteUserCredentialsByName
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        default:
          description: Unexpected error
components:
  schemas:
    UpdateEvent:
      title: Update Event
      description: Indicates that an endpoint was updated
      type: object
      required: [event, data]
      properties:
        event:
          description: Type of event
          type: string
          enum: [update]
        data:
          description: Event details
          type: string
          format: uri
          example: /v1/services/demo-service
    UserProfile:
      title: User Profile
      type: object
      properties:
        name:
          description: User name
          readOnly: true
          type: string
          example: max
        role:
          description: Privilege role
          readOnly: true
          type: string
          enum: [common, admin]
        hasPassword:
          description: Whether or not the user has a password
          readOnly: true
          type: boolean
        displayName:
          description: Name to be displayed in clients
          type: string
          example: Max
        startPage:
          description: Name of the page to be displayed by default in clients
          type: string
          example: my-services
        errorAlerts:
          description: Whether or not error alerts are enabled for all services for the user
          type: boolean
        healthAlerts:
          description: Whether or not health alerts are enabled for all services for this user
          type: boolean
        versionAlerts:
          description: Whether or not version alerts are enabled for all services for this user
          type: boolean
    UserAlertChannel:
      title: User Alert Channel
      type: object
      properties:
        id:
          description: Channel ID
          readOnly: true
          type: string
          example: e222bdbd-9b08-4a85-b939-0dfce13547b6
        url:
          description: '[Shoutrrr URL](https://containrrr.dev/shoutrrr/services/overview/#services_overview) to send alerts to'
          type: string
          format: uri
          example: ntfy://ntfy.sh/example
        errorAlerts:
          description: Whether or not the channel is used for error alerts
          type: boolean
        healthAlerts:
          description: Whether or not the channel is used for health alerts
          type: boolean
        versionAlerts:
          description: Whether or not the channel is used for version alerts
          type: boolean
    Layout:
      title: Layout
      type: object
      properties:
        pages:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                description: Unique page name
                type: string
                example: my-services
              displayName:
                description: Name to be displayed in clients
                type: string
                example: My Services
              header:
                description: '[CommonMark](http://commonmark.org/help/) page header'
                type: string
                example: '**Markdown** content'
              sections:
                type: array
                items:
                  type: object
                  required: [id]
                  properties:
                    id:
                      description: Section ID
                      type: string
                      example: e222bdbd-9b08-4a85-b939-0dfce13547b6
                    name:
                      description: Section name
                      type: string
                      example: Entertainment
                    icon:
                      description: Icon URL
                      type: string
                      format: uri
                      example: data:image/svg+xml;base64,…
                    serviceIDs:
                      type: array
                      uniqueItems: true
                      items:
                        description: Service ID
                        type: string
                        example: e222bdbd-9b08-4a85-b939-0dfce13547b6
    User:
      title: User
      type: object
      properties:
        name:
          description: User name
          type: string
          example: max
        role:
          description: Privilege role
          type: string
          enum: [common, admin]
        password:
          description: Password
          writeOnly: true
          type: string
          example: p4ssw0rd
        hasPassword:
          description: Whether or not the user has a password
          readOnly: true
          type: boolean
    HTTPCredential:
      title: HTTP Credential
      type: object
      properties:
        name:
          description: Credential name
          type: string
          example: my-credential
        type:
          description: Credential type
          type: string
          enum: [basic, bearer, header, query]
        key:
          description: |
            Credential key

            The purpose of the key varies based on the selected type:
            | Type     | Description         |
            | -------- | ------------------- |
            | `basic`  | User name           |
            | `bearer` | *unused*            |
            | `header` | Header name         |
            | `query`  | Query parameter key |
          type: string
          example: max
        value:
          description: |
            Credential value

            The purpose of the value varies based on the selected type:
            | Type     | Description           |
            | -------- | --------------------- |
            | `basic`  | Password              |
            | `bearer` | Bearer token          |
            | `header` | Header value          |
            | `query`  | Query parameter value |
          writeOnly: true
          type: string
          example: p4ssw0rd
        hasValue:
          description: Whether or not the credential has a value
          readOnly: true
          type: boolean
    SSHCredential:
      title: SSH Credential
      type: object
      properties:
        name:
          description: Credential name
          type: string
          example: my-credential
        user:
          description: User name
          type: string
          example: max
        password:
          description: Password
          writeOnly: true
          type: string
          example: p4ssw0rd
        hasPassword:
          description: Whether or not the credential has a password
          readOnly: true
          type: boolean
        privateKey:
          description: Private key
          writeOnly: true
          type: string
          example: -----BEGIN OPENSSH PRIVATE KEY-----\n…
        hasPrivateKey:
          description: Whether or not the credential has a private key
          readOnly: true
          type: boolean
    UserCredential:
      title: User Credential
      type: object
      properties:
        name:
          description: Credential name
          type: string
          example: my-credential
        description:
          description: Description
          type: string
          example: My secret credential
        value:
          description: Credential value
          writeOnly: true
          type: string
          example: s3cr3t
        hasValue:
          description: Whether or not the credential has a value
          readOnly: true
          type: boolean
  securitySchemes:
    BearerAuth:
      description: Provide the access token with an Bearer authorization header
      type: http
      scheme: bearer
      bearerFormat: JWT
    BearerAuthInHeader:
      description: Provide the access token with a query parameter in scenarios where headers aren't supported, such as with the [EventSource](https://developer.mozilla.org/en-US/docs/Web/API/EventSource) API
      type: apiKey
      in: query
      name: accessToken
security:
  - BearerAuth: []
  - BearerAuthInHeader: []
