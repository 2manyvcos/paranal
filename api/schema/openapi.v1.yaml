openapi: 3.2.1
info:
  title: Paranal API
  description: This documentation describes the Paranal API.
  license:
    name: This file is distributed under the MIT license for the purpose of interoperability
    url: https://opensource.org/licenses/MIT
  version: 1.0.0
externalDocs:
  description: Paranal Documentation
  url: https://2manyvcos.github.io/paranal
servers:
  - url: '{{ .api }}/v1'
tags:
  - name: Events
    description: Get events
  - name: States
    description: Manage states
paths:
  /events:
    get:
      tags: [Events]
      summary: Get events
      operationId: getEvents
      responses:
        '200':
          description: Successful operation
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChangeEvent'
                discriminator:
                  propertyName: event
                  mapping:
                    change: '#/components/schemas/ChangeEvent'
        default:
          description: Unexpected error
  /registries/{registryName}/states:
    parameters:
      - in: path
        name: registryName
        description: Registry name
        required: true
        schema:
          type: string
          example: services
    get:
      tags: [States]
      summary: List states in a registry
      operationId: getRegistriesByNameStates
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/State'
        default:
          description: Unexpected error
  /registries/{registryName}/states/{stateID}:
    parameters:
      - in: path
        name: registryName
        description: Registry name
        required: true
        schema:
          type: string
          example: services
      - in: path
        name: stateID
        description: State ID
        required: true
        schema:
          type: string
          example: paranal
    get:
      tags: [States]
      summary: Get a state in a registry
      operationId: getRegistriesByNameStatesByID
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '404':
          description: Not found
        default:
          description: Unexpected error
components:
  schemas:
    ChangeEvent:
      title: Change Event
      description: Event that indicates that a resource has changed
      type: object
      required: [event, data]
      properties:
        event:
          description: Type of event
          type: string
          enum: [change]
        data:
          description: Event details
          type: string
          format: uri
          example: v1/registries/services/paranal
    State:
      title: State
      description: Arbitrary set of information
      type: object
      properties:
        registry:
          description: Registry name
          type: string
          example: services
        id:
          description: State ID
          type: string
          example: paranal
        data:
          description: Data
          type: object
          additionalProperties: true
          example:
            name: Paranal
            status: healthy
