<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="{{ .tagline }}" />
    <link rel="icon" href="{{ .favicon }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" href="{{ .appleTouchIcon }}" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="{{ .theme }}" />
    <title>{{ .appName }}</title>
    <style>
      :root {
        --t-app-name: '{{ .appName }}';
        --t-tagline: '{{ .tagline }}';
        --t-logo: url('{{ .logo }}');
      }
    </style>
    <script>
      window.paranal = {
        appName: '{{ .appName }}',
        tagline: '{{ .tagline }}',
        logo: '{{ .logo }}',
        footer: '{{ .footer }}',
        logoutRedirectURL: '{{ .logoutRedirectURL }}',
      };

      const customScript = '{{ .customScript }}';
      if (customScript) import(customScript);
    </script>
    <script type="module" crossorigin src="/assets/index-B-MviH-y.js"></script>
  </head>
  <body>
    <div id="root" class="app"></div>
  </body>
</html>
